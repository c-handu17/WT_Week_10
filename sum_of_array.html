<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Array</title>
</head>
<body>
    <script>
    let arr_1 = [100, 200, 300, 400, 500];
    let sum_of_arr = 0;
    for (let i=0; i<arr_1.length; i++)
    {
        sum_of_arr +=arr_1[i];
    }
    document.write("Sum ="+sum_of_arr)
    </script>
</body>
</html>
