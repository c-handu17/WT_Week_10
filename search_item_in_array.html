<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Item in Array</title>
</head>
<body>
    <script>
        let arr_1 = [50, 80, 65, 47, 83];
        let key = 47;
        let found = false;

        for (let i=0; i<arr_1.length; i++)
        {
            if (arr_1[i] == key){
                found = true;
                break;
            }
        }
        if (found){
            document.write(found);
        }
        else{
            document.write(found);
        }

    </script>
</body>
</html>
