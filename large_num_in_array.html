<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Number</title>
</head>
<body>
    <script>
        let arr_1 = [100, 200, 300, 1000, 2000];
        let largest_value = arr_1[0];

        for (let i=0; i<arr_1.length; i++)
        {
            if (arr_1[i] > largest_value){
                largest_value = arr_1[i];
            }
        }

        document.write("Largest Value :"+ largest_value);
    </script>
</body>
</html>
